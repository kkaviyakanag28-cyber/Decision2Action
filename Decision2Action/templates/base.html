<!doctype html>
<html>
<head>
<title>Decision2Action</title>
<style>
body{font-family:Arial;margin:0;background:#f5f6f8;color:#222}
nav{background:#222;color:#fff;padding:15px 25px}
nav a{color:#fff;margin-right:20px;text-decoration:none}
main{padding:25px;max-width:1100px;margin:auto}
.card{background:white;padding:18px;margin:12px 0;border-radius:8px;box-shadow:0 1px 5px #ddd}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
button{padding:9px 14px;border:0;border-radius:5px;cursor:pointer}
.approve{background:#d8f3dc}.override{background:#ffd6d6}
input,textarea{width:100%;padding:9px;margin:7px 0 12px;box-sizing:border-box}
</style>
</head>
<body>
<nav>
<a href="/">Dashboard</a><a href="/actions">Actions</a><a href="/audit">Audit Log</a>
</nav>
<main>
{% with messages = get_flashed_messages() %}
{% for message in messages %}<div class="card">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
